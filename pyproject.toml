[project]
name = "mediaforge"
version = "1.0.0"
description = "API-first media generation pipeline — no browser, no captcha, 10x faster"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
    "edge-tts>=6.1",
    "Pillow>=10.0",
]

[project.scripts]
mediaforge = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
